# Production deployment for nycharealtalk.org on a single server.
#
# First-time setup:
#   1. Point nycharealtalk.org, www.nycharealtalk.org, and tiles.nycharealtalk.org DNS to this server.
#   2. Copy .env.example to .env.prod and fill in production values (see .env.example).
#   3. Add the production-only vars to .env.prod:
#        NYCHAREALTALK_ALLOWED_HOSTS=nycharealtalk.org,www.nycharealtalk.org
#        NYCHAREALTALK_MEMCACHE_LOCATION=memcached:11211
#        NYCHAREALTALK_EMAIL_HOST=...
#        NYCHAREALTALK_EMAIL_USER=...
#        NYCHAREALTALK_EMAIL_PASSWORD=...
#        NYCHAREALTALK_DEFAULT_FROM_EMAIL=...
#        NYCHAREALTALK_SERVER_EMAIL=...
#   4. docker compose -f docker-compose.prod.yml up -d db memcached
#   5. docker compose -f docker-compose.prod.yml run --rm web python manage.py migrate
#   6. docker compose -f docker-compose.prod.yml run --rm web python manage.py collectstatic --noinput
#   7. ./docker/init-letsencrypt.sh   # issues SSL certs and starts everything
#
# Subsequent deploys:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml run --rm web python manage.py migrate
#   docker compose -f docker-compose.prod.yml run --rm web python manage.py collectstatic --noinput

services:
  db:
    image: postgis/postgis:16-3.4
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/create-views.sql:/docker-entrypoint-initdb.d/create-views.sql
    environment:
      POSTGRES_DB: ${NYCHAREALTALK_DB_NAME:-nycharealtalk}
      POSTGRES_USER: ${NYCHAREALTALK_DB_USER:-nycharealtalk}
      POSTGRES_PASSWORD: ${NYCHAREALTALK_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NYCHAREALTALK_DB_USER:-nycharealtalk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  memcached:
    image: memcached:alpine
    restart: unless-stopped

  web:
    build: .
    command: gunicorn nycharealtalk.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - static_files:/app/nycharealtalk/collected_static
      - media_files:/app/nycharealtalk/media
    working_dir: /app/nycharealtalk
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
    env_file: .env.prod
    environment:
      NYCHAREALTALK_DB_HOST: db
      NYCHAREALTALK_DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: nycharealtalk.settings.production
    restart: unless-stopped

  tilestache:
    build:
      context: .
      dockerfile: Dockerfile.tilestache
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${NYCHAREALTALK_DB_NAME:-nycharealtalk}
      DB_USER: ${NYCHAREALTALK_DB_USER:-nycharealtalk}
      DB_PASSWORD: ${NYCHAREALTALK_DB_PASSWORD}
      MEMCACHED_HOST: memcached
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/static:ro
      - media_files:/media:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
      - tilestache
    restart: unless-stopped

  scheduler:
    build: .
    entrypoint: /app/docker/scheduler-entrypoint.sh
    volumes:
      - ./docker/crontab:/etc/cron.d/nycharealtalk:ro
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
    env_file: .env.prod
    environment:
      NYCHAREALTALK_DB_HOST: db
      NYCHAREALTALK_DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: nycharealtalk.settings.production
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Renew twice daily; certbot only acts when < 30 days remain.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  postgres_data:
  static_files:
  media_files:
  certbot_certs:
  certbot_www:
